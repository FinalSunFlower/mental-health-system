<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE135"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
    <linearGradient id="petalEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <radialGradient id="centerGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#8B5C2F"/>
      <stop offset="45%" style="stop-color:#654321"/>
      <stop offset="80%" style="stop-color:#4A3018"/>
      <stop offset="100%" style="stop-color:#2D1810"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39FF14"/>
      <stop offset="100%" style="stop-color:#00CC44"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(32,28)">
    <g filter="url(#neonGlow)">
      {[0,30,60,90,120,150,180,210,240,270,300,330].map((angle) => (
        <ellipse key={angle} cx={0} cy={-16} rx={7} ry={14} fill="url(#petalGrad)" stroke="url(#petalEdge)" strokeWidth={0.8} transform={`rotate(${angle})`}/>
      ))}
    </g>

    <circle cx={0} cy={0} r={11} fill="url(#centerGrad)" filter="url(#glowStrong)" stroke="#8B5CF6" strokeWidth={1}/>
    <circle cx={-2} cy={-2} r={1.2} fill="#9B6B3F" opacity={0.6}/>
    <circle cx={3} cy={-1} r={0.9} fill="#9B6B3F" opacity={0.5}/>
    <circle cx={0} cy={3} r={1.1} fill="#9B6B3F" opacity={0.4}/>
    <circle cx={-3.5} cy={2} r={0.7} fill="#9B6B3F" opacity={0.3}/>
    <circle cx={3.5} cy={3} r={0.85} fill="#9B6B3F" opacity={0.35}/>

    <path d="M-4,10 Q-7,18 -5,24 Q-3,20 0,16 Q3,20 5,24 Q7,18 4,10 Z" fill="url(#leafGrad)" filter="url(#neonGlow)" opacity={0.9}/>
  </g>
</svg>
